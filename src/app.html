<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#000000" />
		<!-- The portrait is the largest thing on screen: start fetching it before scripts and fonts. -->
		<link rel="preload" as="image" type="image/webp" href="%sveltekit.assets%/images/kabir-saheb-132.webp" imagesrcset="%sveltekit.assets%/images/kabir-saheb-132.webp 1x, %sveltekit.assets%/images/kabir-saheb.webp 2x" fetchpriority="high" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="any" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/images/apple-touch-icon.png" />
		<link rel="preload" href="%sveltekit.assets%/fonts/cormorant-garamond-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div class="app">%sveltekit.body%</div>
	</body>
</html>
